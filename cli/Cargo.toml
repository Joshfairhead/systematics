[package]
name = "systematics-cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "systematics"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5.40", features = ["derive"] }
surrealdb = { version = "2.3.4", features = ["kv-mem"] }
systematics-api = { path = "../api" }
systematics-library = { path = "../library" }
tokio = { version = "1.45.1", features = ["full"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
