[workspace]
members = [
    "api",
    "library",
    "cli",
    "frontend",
    "dev-runner"
]
default-members = ["cli"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"

# Optimize for smaller builds and faster compile times
[profile.dev]
debug = 1  # Reduced debug info for faster builds
incremental = true

[profile.release]
opt-level = "s"  # Optimize for size
lto = true
codegen-units = 1
panic = "abort"

# Fast builds for development
[profile.dev.package."*"]
opt-level = 1
