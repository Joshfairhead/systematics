[package]
name = "systematics-api"
version.workspace = true
edition.workspace = true

[dependencies]
serde = { version = "1.0", features = ["derive"] }
thiserror = "1.0"
uuid = { version = "1.0", features = ["v4"] }

[features]
default = []
cli = []
web = ["wasm-bindgen"]
serde_support = ["serde"]

[dependencies.wasm-bindgen]
version = "0.2"
optional = true 